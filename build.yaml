changelog: |-
  ## v1.7.3.0
  ### New
  - New "Requests per minute" setting under LRCLIB server. Default: 60. lrclib.net allows up to 90. -> #63
  - Rate limit warnings in the log now show if LRCLIB limited your IP or the app. -> #63

  ### Fixes
  - Requests to LRCLIB are spaced out to stay under its rate limit. Before, the task kept running into 429 errors. -> #63
  - After a rate limit, the plugin waits a little extra, as LRCLIB asks.
